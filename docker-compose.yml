services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raizel
      POSTGRES_USER: raizel
      POSTGRES_PASSWORD: raizel
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizel"]
      interval: 5s
      timeout: 3s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: raizel
      APP_USER: raizel
      APP_USER_PASSWORD: raizel
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  oracle_data:
