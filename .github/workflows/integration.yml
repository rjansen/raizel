name: integration

# Manual only — Oracle Free pulls a ~1.4 GB image and needs ~90 s to
# become healthy, so we don't burn that on every push.

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: raizel
          POSTGRES_PASSWORD: raizel
          POSTGRES_DB: raizel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raizel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: raizel
          APP_USER: raizel
          APP_USER_PASSWORD: raizel
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: integration tests
        env:
          POSTGRES_DSN: postgres://raizel:raizel@localhost:5432/raizel?sslmode=disable
          ORACLE_DSN: oracle://raizel:raizel@localhost:1521/FREEPDB1
        run: go test -tags=integration -v -count=1 ./...
